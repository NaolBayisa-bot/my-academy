server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the Express server container.
    # "server" is the compose service name; the Vite dev-proxy does not
    # apply to built output, so nginx must forward /api itself.
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
