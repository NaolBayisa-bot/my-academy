server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow larger payloads (e.g. course image/asset uploads) through the proxy.
    client_max_body_size 25m;

    # Compress text-like assets served or proxied by nginx.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    # SPA fallback: any unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash-fingerprinted static assets (Vite adds a content hash in filenames)
    # can be cached long-term and served immutably.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy API requests to the Express backend container ("server" is
    # the compose service name). The Vite dev-server proxy does not apply to the
    # built output, so nginx must forward /api itself.
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
