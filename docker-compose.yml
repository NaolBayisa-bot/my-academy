services:
  db:
    image: postgres:16-alpine
    container_name: academy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_pass
      POSTGRES_DB: academy_lms
    # Publish Postgres on the host so local tooling (npm run seed / db:migrate)
    # can reach it via localhost:5432. The server service keeps using the
    # internal `db:5432` host from the compose network, so this mapping does
    # not affect container-to-container traffic.
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d academy_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: academy_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://lms:lms_pass@db:5432/academy_lms
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ishub.academy}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123!}
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    container_name: academy_client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
volumes:
  db_data: